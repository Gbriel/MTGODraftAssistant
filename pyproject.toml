[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgo-draft-assistant"
version = "0.1.0"
description = "Live, read-only draft tracker for Magic Online cube drafts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mtgo-draft-assistant = "mtgo_draft_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
