<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTGO Draft Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="title">MTGO Draft Assistant</span>
      <span id="cube" class="muted"></span>
    </div>
    <div id="position" class="position idle">no draft</div>
    <div class="conn">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text" class="muted">connecting</span>
    </div>
  </header>

  <div id="players" class="players"></div>
  <div id="warnings" class="warnings" hidden></div>

  <main class="grid">
    <section class="pane" id="pane-current">
      <h2>On screen now <span id="current-count" class="count"></span></h2>
      <div id="current-wheel" class="wheel-note" hidden></div>
      <ol id="current-cards" class="cards"></ol>
      <p id="current-empty" class="empty"></p>
    </section>

    <section class="pane" id="pane-flow">
      <h2>In flight <span id="inflight-count" class="count"></span></h2>
      <div id="inflight"></div>
      <p id="inflight-empty" class="empty">Nothing you passed is due back.</p>

      <h2 class="spaced">Wheels <span id="wheel-count" class="count"></span></h2>
      <div id="wheels"></div>
      <p id="wheels-empty" class="empty">No pack has come back around yet.</p>
    </section>

    <section class="pane" id="pane-picks">
      <h2>Your picks <span id="pick-count" class="count"></span></h2>
      <div id="picks"></div>
      <p id="picks-empty" class="empty">No picks yet.</p>
    </section>
  </main>

  <footer class="foot muted">
    <span id="file"></span>
    <span id="updated"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
