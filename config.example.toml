# Copy to config.toml (gitignored) and set the path you entered in
# MTGO: Settings -> "Save Draft Log". Backslashes need doubling in TOML,
# or use forward slashes.
log_dir = "C:/Users/you/MTGODraftLogs"

# Cube list for the pool tracker: which cards could still turn up. A path to
# a text file (one card per line) or a URL with a Color | Card table, e.g.
# the official MTGO Vintage Cube list. Optional: without it the tracker still
# shows seen / in-flight / gone, but cannot list what you have never seen.
# In --arena mode the 17Lands card list is used automatically when unset.
[cube]
list = "https://www.mtgo.com/vintage-cube-cardlist"

# 17Lands ratings (Arena data for the Arena cube; partial overlap with the
# MTGO cube). Everything here is optional; these are the defaults.
[ratings]
enabled = true
expansion = "Cube - Powered"   # "Cube" is the unpowered Arena cube
format = "PremierDraft"        # 17Lands "event type"; TradDraft also has cube data
time_period = "ALL_TIME"       # every run of the cube; LATEST_EVENT, LAST_TWO_WEEKS, ... exist
refresh_hours = 24             # re-download at most this often
min_games = 500                # hide a win rate below this many games in hand
